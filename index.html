  <style>
    /* =========================================
       1. DESIGN TOKENS & EDITORIAL PALETTE
       ========================================= */
    :root {
      --bg-primary: #FAF8F5;       /* Warm Editorial Paper */
      --bg-secondary: #F2EFE9;     /* Subtle Cream Contrast */
      --bg-card: #FFFFFF;          /* Crisp Card Surface */
      --ink-primary: #141413;      /* Rich Charcoal Ink */
      --ink-secondary: #52504C;    /* Muted Editorial Gray */
      --ink-muted: #85827C;        /* Caption & Meta Gray */
      --accent: #C84B31;           /* Terracotta Print Accent */
      --accent-hover: #A83A23;     /* Deep Terracotta */
      --border-hairline: #DED9D0;  /* Fine Magazine Rule */
      --border-strong: #141413;    /* Bold Editorial Divider */

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --container-max: 1220px;
      --gutter: clamp(1.25rem, 4vw, 3rem);
      --section-pad: clamp(4.5rem, 8vw, 7.5rem);
      --transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* =========================================
       2. RESET & BASE TYPOGRAPHY
       ========================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
      background-color: var(--bg-primary);
      color: var(--ink-primary);
    }

    body {
      font-family: var(--font-sans);
      line-height: 1.65;
      color: var(--ink-primary);
      background-color: var(--bg-primary);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img, svg {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background-color: var(--accent);
      color: #FFFFFF;
    }

    .container {
      width: 100%;
      max-width: var(--container-max);
      margin: 0 auto;
      padding-left: var(--gutter);
      padding-right: var(--gutter);
    }

    /* Editorial Section Header Pattern */
    .section-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding-bottom: 1.25rem;
      margin-bottom: clamp(2.5rem, 5vw, 3.75rem);
      border-bottom: 2px solid var(--border-strong);
    }

    .section-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent);
      font-weight: 500;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(2.1rem, 4vw, 3.1rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    /* =========================================
       3. STICKY MINIMAL HEADER
       ========================================= */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-hairline);
      transition: box-shadow var(--transition);
    }

    .site-header.scrolled {
      box-shadow: 0 4px 24px rgba(20, 20, 19, 0.04);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 4.5rem;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-family: var(--font-serif);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--accent);
      display: inline-block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 2.5vw, 2.25rem);
      list-style: none;
    }

    .nav-links a {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--ink-secondary);
      position: relative;
      padding: 0.25rem 0;
      transition: color 0.2s ease;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1.5px;
      background-color: var(--accent);
      transition: width var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--ink-primary);
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
      width: 100%;
    }

    .nav-cta {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--ink-primary);
      border-radius: 999px;
      transition: all 0.25s ease;
    }

    .nav-cta:hover {
      background-color: var(--ink-primary);
      color: var(--bg-primary);
    }

    /* =========================================
       4. SPLIT-SCREEN HERO SECTION
       ========================================= */
    .hero {
      border-bottom: 1px solid var(--border-hairline);
      padding-top: clamp(2.5rem, 5vw, 4rem);
      padding-bottom: clamp(3.5rem, 6vw, 5.5rem);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: clamp(2.5rem, 5vw, 4.5rem);
      align-items: center;
    }

    .hero-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-secondary);
      margin-bottom: 1.5rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border-hairline);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--accent);
      font-weight: 500;
    }

    .status-pill::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
    }

    .hero-name {
      font-family: var(--font-serif);
      font-size: clamp(3.25rem, 6.5vw, 5.4rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .hero-name em {
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
    }

    .hero-tagline {
      font-size: clamp(1.125rem, 1.8vw, 1.35rem);
      color: var(--ink-secondary);
      max-width: 34ch;
      line-height: 1.55;
      margin-bottom: 2.25rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.25rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background-color: var(--ink-primary);
      color: var(--bg-primary);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 1rem 1.85rem;
      border-radius: 2px;
      border: 1px solid var(--ink-primary);
      transition: all var(--transition);
    }

    .btn-primary:hover {
      background-color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .btn-secondary {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-primary);
      border-bottom: 1px solid var(--ink-primary);
      padding-bottom: 0.2rem;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .btn-secondary:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Split Hero Right Visual Frame */
    .hero-visual {
      position: relative;
    }

    .portrait-frame {
      position: relative;
      aspect-ratio: 4 / 5;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      padding: 0.85rem;
      box-shadow: 14px 14px 0px var(--bg-secondary), 14px 14px 0px 1px var(--border-hairline);
    }

    .portrait-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #E7E1D6 0%, #D4CBBF 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.75rem;
      position: relative;
      overflow: hidden;
    }

    .portrait-caption {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
color: var(--ink-secondary);
margin-top: 0.85rem;
}
/* =========================================
5. ABOUT ME SECTION (PULL QUOTE + BIO)
========================================= */
.section-block {
padding-top: var(--section-pad);
padding-bottom: var(--section-pad);
border-bottom: 1px solid var(--border-hairline);
}
.about-grid {
display: grid;
grid-template-columns: 0.8fr 1.2fr;
gap: clamp(2.5rem, 5vw, 5rem);
align-items: start;
}
.about-photo-card {
background-color: var(--bg-card);
border: 1px solid var(--border-hairline);
padding: 0.75rem;
}
.about-photo-placeholder {
aspect-ratio: 1 / 1;
background: linear-gradient(135deg, #272624 0%, #3E3B37 100%);
color: var(--bg-primary);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
padding: 2rem;
}
.about-photo-note {
font-family: var(--font-mono);
font-size: 0.72rem;
color: var(--ink-muted);
margin-top: 0.65rem;
}
.pull-quote {
font-family: var(--font-serif);
font-style: italic;
font-size: clamp(1.55rem, 2.7vw, 2.15rem);
line-height: 1.32;
color: var(--ink-primary);
border-left: 3px solid var(--accent);
padding-left: 1.5rem;
margin-bottom: 2rem;
}
.about-bio {
font-size: 1.12rem;
color: var(--ink-secondary);
line-height: 1.75;
margin-bottom: 2rem;
}
.about-highlights {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 1.25rem;
padding-top: 1.75rem;
border-top: 1px solid var(--border-hairline);
}
.stat-num {
font-family: var(--font-serif);
font-size: 2rem;
font-weight: 700;
color: var(--ink-primary);
line-height: 1.1;
}
.stat-label {
font-family: var(--font-mono);
font-size: 0.74rem;
text-transform: uppercase;
letter-spacing: 0.06em;
color: var(--ink-muted);
margin-top: 0.35rem;
}
/* =========================================
6. SKILLS & TOOLS SECTION
========================================= */
.skills-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 2.5rem;
}
.skill-column {
background-color: var(--bg-card);
border: 1px solid var(--border-hairline);
padding: 2rem;
}
.skill-cat-title {
font-family: var(--font-serif);
font-size: 1.35rem;
font-weight: 700;
margin-bottom: 0.4rem;
}
.skill-cat-sub {
font-size: 0.88rem;
color: var(--ink-muted);
margin-bottom: 1.75rem;
padding-bottom: 1rem;
border-bottom: 1px solid var(--border-hairline);
}
/* Progress Bars */
.skill-bar-list {
display: flex;
flex-direction: column;
gap: 1.25rem;
}
.skill-bar-header {
display: flex;
justify-content: space-between;
font-size: 0.9rem;
font-weight: 600;
margin-bottom: 0.45rem;
}
.skill-bar-header span:last-child {
font-family: var(--font-mono);
font-size: 0.78rem;
color: var(--ink-muted);
}
.progress-track {
width: 100%;
height: 6px;
background-color: var(--bg-secondary);
overflow: hidden;
}
.progress-fill {
height: 100%;
background-color: var(--ink-primary);
transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
}
.progress-fill.accent {
background-color: var(--accent);
}
/* Editorial Tag Cloud */
.tag-cloud {
display: flex;
flex-wrap: wrap;
gap: 0.6rem;
}
.skill-tag {
font-family: var(--font-mono);
font-size: 0.8rem;
padding: 0.45rem 0.85rem;
background-color: var(--bg-primary);
border: 1px solid var(--border-hairline);
color: var(--ink-primary);
transition: all 0.2s ease;
}
.skill-tag:hover {
border-color: var(--ink-primary);
background-color: var(--ink-primary);
color: var(--bg-primary);
}
/* =========================================
7. PROJECTS / SELECTED WORK GRID
========================================= */
.projects-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: clamp(2rem, 4vw, 3rem);
}
.project-card {
background-color: var(--bg-card);
border: 1px solid var(--border-hairline);
display: flex;
flex-direction: column;
transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
}
.project-card:hover {
transform: translateY(-5px);
border-color: var(--ink-primary);
box-shadow: 0 18px 36px rgba(20, 20, 19, 0.06);
}
.project-thumb {
aspect-ratio: 16 / 10;
border-bottom: 1px solid var(--border-hairline);
overflow: hidden;
position: relative;
}
.project-thumb svg {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
}
.project-card:hover .project-thumb svg {
transform: scale(1.03);
}
.project-body {
padding: 1.85rem;
display: flex;
flex-direction: column;
flex-grow: 1;
}
.project-meta {
display: flex;
justify-content: space-between;
align-items: center;
font-family: var(--font-mono);
font-size: 0.74rem;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(--accent);
margin-bottom: 0.75rem;
}
.project-title {
font-family: var(--font-serif);
font-size: 1.55rem;
font-weight: 700;
line-height: 1.22;
margin-bottom: 0.75rem;
}
.project-desc {
font-size: 0.96rem;
color: var(--ink-secondary);
line-height: 1.65;
margin-bottom: 1.5rem;
flex-grow: 1;
}
.project-link {
display: inline-flex;
align-items: center;
gap: 0.45rem;
font-family: var(--font-mono);
font-size: 0.8rem;
font-weight: 500;
text-transform: uppercase;
letter-spacing: 0.08em;
color: var(--ink-primary);
padding-top: 1rem;
border-top: 1px solid var(--border-hairline);
transition: color 0.2s ease;
}
.project-link:hover {
color: var(--accent);
}
.project-link span {
transition: transform 0.25s ease;
}
.project-link:hover span {
transform: translateX(4px);
}
/* =========================================
8. EDUCATION TIMELINE SECTION
========================================= */
.edu-timeline {
display: flex;
flex-direction: column;
border-top: 1px solid var(--border-hairline);
}
.edu-item {
display: grid;
grid-template-columns: 220px 1fr;
gap: 2rem;
padding: 2.25rem 0;
border-bottom: 1px solid var(--border-hairline);
align-items: baseline;
}
.edu-date {
font-family: var(--font-mono);
font-size: 0.84rem;
color: var(--accent);
font-weight: 500;
}
.edu-degree {
font-family: var(--font-serif);
font-size: 1.45rem;
font-weight: 700;
margin-bottom: 0.3rem;
}
.edu-school {
font-size: 1rem;
font-weight: 600;
color: var(--ink-secondary);
margin-bottom: 0.75rem;
}
.edu-details {
font-size: 0.95rem;
color: var(--ink-secondary);
max-width: 65ch;
}
/* =========================================
9. CONTACT SECTION & FOOTER
========================================= */
.contact-section {
background-color: var(--ink-primary);
color: var(--bg-primary);
padding-top: var(--section-pad);
padding-bottom: 3rem;
}
.contact-section .section-header {
border-bottom-color: rgba(250, 248, 245, 0.22);
}
.contact-section .section-eyebrow {
color: #E57A64;
}
.contact-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: clamp(2.5rem, 5vw, 5rem);
margin-bottom: 4.5rem;
}
.contact-lead {
font-family: var(--font-serif);
font-size: clamp(1.6rem, 2.8vw, 2.25rem);
line-height: 1.3;
margin-bottom: 1.5rem;
}
.contact-email {
display: inline-block;
font-family: var(--font-serif);
font-style: italic;
font-size: clamp(1.35rem, 2.4vw, 1.9rem);
color: #E57A64;
border-bottom: 1px solid #E57A64;
padding-bottom: 0.25rem;
margin-bottom: 2.25rem;
transition: opacity 0.2s ease;
}
.contact-email:hover {
opacity: 0.82;
}
.social-row {
display: flex;
flex-wrap: wrap;
gap: 1rem;
}
.social-link {
display: inline-flex;
align-items: center;
gap: 0.5rem;
font-family: var(--font-mono);
font-size: 0.8rem;
padding: 0.65rem 1.1rem;
border: 1px solid rgba(250, 248, 245, 0.25);
color: var(--bg-primary);
transition: all 0.25s ease;
}
.social-link:hover {
background-color: var(--bg-primary);
color: var(--ink-primary);
border-color: var(--bg-primary);
}
/* Editorial Contact Form */
.contact-form {
display: flex;
flex-direction: column;
gap: 1.15rem;
}
.form-group label {
display: block;
font-family: var(--font-mono);
font-size: 0.74rem;
text-transform: uppercase;
letter-spacing: 0.1em;
color: rgba(250, 248, 245, 0.72);
margin-bottom: 0.45rem;
}
.form-group input,
.form-group textarea {
width: 100%;
background-color: rgba(255, 255, 255, 0.06);
border: 1px solid rgba(250, 248, 245, 0.24);
color: var(--bg-primary);
font-family: var(--font-sans);
font-size: 0.95rem;
padding: 0.85rem 1rem;
border-radius: 2px;
transition: border-color 0.2s ease, background-color 0.2s ease;
}
.form-group input:focus,
.form-group textarea:focus {
outline: none;
border-color: #E57A64;
background-color: rgba(255, 255, 255, 0.1);
}
.btn-submit {
align-self: flex-start;
background-color: var(--accent);
color: #FFFFFF;
border: none;
font-family: var(--font-sans);
font-weight: 600;
font-size: 0.95rem;
padding: 0.95rem 2rem;
cursor: pointer;
border-radius: 2px;
transition: background-color 0.25s ease;
}
.btn-submit:hover {
background-color: var(--accent-hover);
}
.form-feedback {
font-family: var(--font-mono);
font-size: 0.82rem;
color: #8CE0A8;
display: none;
}
.footer-bottom {
display: flex;
flex-wrap: wrap;
justify-content: space-between;
gap: 1rem;
padding-top: 2rem;
border-top: 1px solid rgba(250, 248, 245, 0.16);
font-family: var(--font-mono);
font-size: 0.76rem;
color: rgba(250, 248, 245, 0.6);
}
/* =========================================
10. SUBTLE SCROLL REVEAL ANIMATION
========================================= */
.reveal {
opacity: 0;
transform: translateY(22px);
transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.reveal.visible {
opacity: 1;
transform: translateY(0);
}
/* =========================================
11. RESPONSIVE BREAKPOINTS
========================================= */
@media (max-width: 960px) {
.hero-grid,
.about-grid,
.contact-grid {
grid-template-columns: 1fr;
}
.hero-visual {
max-width: 480px;
}
.skills-grid {
grid-template-columns: 1fr;
}
.edu-item {
grid-template-columns: 1fr;
gap: 0.4rem;
}
}
@media (max-width: 720px) {
.projects-grid {
grid-template-columns: 1fr;
}
.nav-links {
display: none;
}
.about-highlights {
grid-template-columns: repeat(3, 1fr);
gap: 0.75rem;
}
}
